<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="darkreader-lock">
<title>Email clean-up · Canvas Coach</title>
<style>
:root{
  --bg:#f6f6f3;--card:#ffffff;--ink:#141413;--ink2:#4f4e4a;--ink3:#7a7974;--line:#e4e3de;--zebra:#fafaf8;--hover:#f0efea;
  --accent:#1f6fd1;--accent-ink:#ffffff;--focus:#1f6fd1;
  /* status: text color + soft fill. Each status also has its own symbol, so color is never the only cue. */
  --due-fg:#1d5fb3;--due-bg:#e7f0fb;
  --ok-fg:#18692b;--ok-bg:#e5f4e8;
  --late-fg:#8a5300;--late-bg:#fdf1dc;
  --miss-fg:#b02a2a;--miss-bg:#fbe7e6;
  --exc-fg:#5d5c57;--exc-bg:#efeeea;
  --unk-fg:#5d4a9e;--unk-bg:#efebfa;
}
@media (prefers-color-scheme: dark){ html[data-theme="auto"]{
  --bg:#121212;--card:#1b1b1a;--ink:#ecebe6;--ink2:#bdbcb5;--ink3:#8d8c85;--line:#2e2e2b;--zebra:#1f1f1e;--hover:#262624;
  --accent:#5b9cf0;--accent-ink:#0b1626;--focus:#7fb1f3;
  --due-fg:#8dbdf5;--due-bg:#1a2b40;--ok-fg:#7fd18f;--ok-bg:#16301d;--late-fg:#f2c26b;--late-bg:#3a2c12;
  --miss-fg:#ff9a94;--miss-bg:#3d1b1a;--exc-fg:#b3b2ab;--exc-bg:#2a2a28;--unk-fg:#b9a8f2;--unk-bg:#2a2540;}}
html[data-theme="dark"]{
  --bg:#121212;--card:#1b1b1a;--ink:#ecebe6;--ink2:#bdbcb5;--ink3:#8d8c85;--line:#2e2e2b;--zebra:#1f1f1e;--hover:#262624;
  --accent:#5b9cf0;--accent-ink:#0b1626;--focus:#7fb1f3;
  --due-fg:#8dbdf5;--due-bg:#1a2b40;--ok-fg:#7fd18f;--ok-bg:#16301d;--late-fg:#f2c26b;--late-bg:#3a2c12;
  --miss-fg:#ff9a94;--miss-bg:#3d1b1a;--exc-fg:#b3b2ab;--exc-bg:#2a2a28;--unk-fg:#b9a8f2;--unk-bg:#2a2540;color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
button,select,input{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1180px;margin:auto;padding:12px 12px 80px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;justify-content:space-between}
h1{font-size:20px;margin:4px 0}
.asof{color:var(--ink2);font-size:13px}
.nav{font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.presets,.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.preset{font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.row label{font-size:12px;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
select,input[type=search],input[type=date]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:14px;min-height:34px}
input[type=search]{min-width:180px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;font-size:14px;cursor:pointer;min-height:34px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

.muted{color:var(--ink3);font-size:13px}
.ok{color:var(--ok-fg)} .bad{color:var(--miss-fg)} .warn{color:var(--late-fg)}
table{width:100%;border-collapse:collapse;font-size:14px} th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--ink2);font-weight:600}
textarea{width:100%;min-height:64px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;color:var(--ink)}
input[type=password],input[type=number]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:34px}
.btn[disabled]{opacity:.5;cursor:default}
</style></head>
<body><div class="wrap">
<div class="top"><h1>Email clean-up</h1><div class="nav"><a href="assignments.html">Assignments</a><a href="dashboard.html">Dashboard</a><a href="inbox.html">Email clean-up</a><a href="location.html">Location</a><a href="health.html">Health</a><a href="./">Settings</a></div></div>
<div id="login" hidden></div><div id="app">
<p class="asof">Sorts his school Gmail into labels and archives the junk. You see the plan first; nothing changes until you press <b>Apply</b>, and <b>Undo</b> puts it all back. It can't send or delete email.</p>
<div class="panel" id="script"></div>
<div class="panel" id="startP"><b>1. Scan his inbox</b>
  <div class="row"><button class="btn" data-days="7">Last 7 days</button><button class="btn" data-days="30">Last 30 days</button>
  <button class="btn" data-days="">Whole inbox</button><span class="muted">or</span>
  <input type="number" id="days" min="1" max="365" placeholder="days" style="width:80px"><button class="btn" id="goDays">Scan</button></div></div>
<div class="panel" id="statusP" hidden></div>
<div class="panel" id="planP" hidden></div>
<div class="panel" id="lastP" hidden></div>
</div></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BOT = "https://coach-bot.ted323-aa5.workers.dev";
let conn = {}; try { conn = JSON.parse(localStorage.getItem("canvasCoachConn") || "{}"); } catch (e) {}
let theme = "auto"; try { theme = localStorage.getItem("ccTheme") || "auto"; } catch (e) {}
document.documentElement.dataset.theme = theme;
async function bot(path, body) {
  const r = await fetch(BOT + path, { method: body ? "POST" : "GET", headers: { Authorization: "Bearer " + conn.token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin("That token didn't work. Use the same GitHub token as the Assignments page."); throw new Error("401"); }
  if (!r.ok) throw new Error(j.error || ("Error " + r.status));
  return j;
}
async function gh(path) {
  const r = await fetch(`https://api.github.com/repos/${conn.owner || "codeted323"}/${conn.repo || "canvas-coach"}/contents/${path}?t=${Date.now()}`, { headers: { Accept: "application/vnd.github.raw+json", Authorization: "Bearer " + conn.token }, cache: "no-store" });
  if (!r.ok) throw new Error("GitHub " + r.status);
  return r.json();
}
const ago = iso => { if (!iso) return "never"; const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " days ago"; };
function showLogin(msg) {
  $("#app").hidden = true; const L = $("#login"); L.hidden = false;
  L.innerHTML = `<div class="panel"><p class="asof">Unlock with the same GitHub token as the Assignments page.</p>
  <label class="legend">Fine-grained token</label><input id="gT" type="password" style="width:100%;margin:4px 0">
  <label class="legend" style="display:block;margin:4px 0 10px"><input type="checkbox" id="gM" checked> Remember on this device</label>
  <button class="btn primary" id="gGo">Unlock</button><p style="color:var(--miss-fg);font-size:14px">${esc(msg || "")}</p></div>`;
  $("#gGo").onclick = () => { conn = { owner: conn.owner || "codeted323", repo: conn.repo || "canvas-coach", token: $("#gT").value.trim() };
    try { localStorage.setItem("canvasCoachConn", JSON.stringify($("#gM").checked ? conn : { owner: conn.owner, repo: conn.repo })); } catch (e) {}
    $("#login").hidden = true; $("#app").hidden = false; start(); };
}

let timer = null;
function render(s) {
  const seen = s.scriptLastSeen, fresh = seen && Date.now() - new Date(seen) < 5 * 60000;
  $("#script").innerHTML = fresh ? `<span class="ok">✓</span> His Gmail script is connected (checked in ${ago(seen)}).`
    : `<span class="warn">⚠</span> His Gmail script hasn't checked in ${seen ? "since " + ago(seen) : "yet"}, so scans won't start. <b>Fix (once, on his account):</b> go to <a href="https://script.google.com" target="_blank" rel="noopener">script.google.com</a> → open the Coach project → pick <b>setup</b> in the function menu at the top → <b>Run</b>. That turns its 1-minute timer back on.`;
  const j = s.job, busy = j && (j.status === "queued" || j.status === "working");
  document.querySelectorAll("#startP button").forEach(b => b.disabled = busy || s.planning);
  const st = $("#statusP");
  if (busy && j.type === "scan") { st.hidden = false; st.innerHTML = `⏳ Scanning ${esc(j.scope)}… ${s.scanned} emails read so far.${j.status === "queued" && !fresh ? " (Waiting for his Gmail script — see the note above.)" : ""}`; }
  else if (s.planning) { st.hidden = false; st.innerHTML = `⏳ Read ${s.scanned} emails. Working out a plan (about a minute)…`; }
  else if (busy) { st.hidden = false; st.innerHTML = `⏳ ${j.type === "undo" ? "Undoing" : "Applying"} in his Gmail… (within a minute)`; }
  else st.hidden = true;
  const P = $("#planP");
  if (s.plan) {
    P.hidden = false;
    P.innerHTML = `<b>2. Review the plan</b> <span class="muted">${s.plan.total} emails scanned · ${s.plan.untouched} left alone</span>
    <table><thead><tr><th>#</th><th>What</th><th>Emails</th><th>Does</th><th>Senders</th></tr></thead><tbody>${s.plan.actions.map(a => `<tr><td>${a.n}</td><td><b>${esc(a.title)}</b></td><td>${a.count}</td>
      <td>${[a.label && "label " + esc(a.label), a.archive ? "archive" : "keep in inbox", a.star && "★ star"].filter(Boolean).join(", ")}</td><td class="muted">${esc(a.senders.join(", "))}</td></tr>`).join("")}</tbody></table>
    <p style="margin:12px 0 4px"><b>Want changes?</b> Say it in plain English, e.g. <i>"leave Amazon in the inbox"</i> or <i>"drop #3"</i>.</p>
    <textarea id="instr"></textarea>
    <div class="row"><button class="btn" id="revise">Update plan</button><span style="flex:1"></span><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="apply">3. Apply</button></div>`;
    $("#revise").onclick = act("/web/inbox/revise", () => ({ instruction: $("#instr").value }), "Updating the plan…");
    $("#cancel").onclick = act("/web/inbox/cancel");
    $("#apply").onclick = act("/web/inbox/apply");
  } else P.hidden = true;
  const L = $("#lastP"), last = s.last;
  if (last || s.undo) {
    L.hidden = false;
    const c = last && last.counts ? Object.entries(last.counts).map(([k, v]) => `${v} ${k}`).join(", ") : "";
    L.innerHTML = (last ? (last.error ? `<span class="bad">✗</span> Last ${esc(last.type)} failed: ${esc(last.error)}` : `<span class="ok">✓</span> Last ${last.type === "undo" ? "undo" : last.type === "apply" ? "clean-up" : esc(last.type)} finished ${ago(last.at)}${c ? ": " + esc(c) : ""}.`) : "")
      + (s.undo && !busy ? ` <button class="btn" id="undo" style="margin-left:8px">Undo last clean-up</button>` : "");
    if ($("#undo")) $("#undo").onclick = () => { if (confirm("Put every email from the last clean-up back the way it was?")) act("/web/inbox/undo")(); };
  } else L.hidden = true;
  clearTimeout(timer);
  if (busy || s.planning) timer = setTimeout(refresh, 4000);
}
function act(path, bodyFn, msg) {
  return async () => {
    document.querySelectorAll("button").forEach(b => b.disabled = true);
    if (msg) { $("#statusP").hidden = false; $("#statusP").textContent = "⏳ " + msg; }
    try { render(await bot(path, bodyFn ? bodyFn() : {})); } catch (e) { if (e.message !== "401") alert(e.message); refresh(); }
  };
}
async function refresh() { try { render(await bot("/web/inbox")); } catch (e) { if (e.message !== "401") $("#script").textContent = "Couldn't reach Coach: " + e.message; } }
function start() {
  if (!conn.token) return showLogin();
  document.querySelectorAll("[data-days]").forEach(b => b.onclick = act("/web/inbox/start", () => ({ days: Number(b.dataset.days) || null })));
  $("#goDays").onclick = () => { const d = Number($("#days").value); if (d > 0) act("/web/inbox/start", () => ({ days: d }))(); };
  refresh();
}
start();
</script></body></html>
